# 台服 (TC) 發版（TataruPraise）。由 release_plugin.py 以 workflow_dispatch 觸發，Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)。
#
# ⚠️ 產出路徑不要用「慣例」去推。Dalamud.NET.Sdk 13 直建 csproj 的實際輸出是
#      TataruPraise/bin/Release/TataruPraise.dll        （組件）
#      TataruPraise/bin/Release/TataruPraise/latest.zip （打包好的外掛）
#      TataruPraise/bin/Release/TataruPraise/TataruPraise.json
#    （與 TCToolbox 實測一致；沒有 bin/x64。）latest.zip 仍用遞迴 Get-ChildItem 找，
#    路徑一旦變動這一步會直接失敗而不是靜默交出舊檔。
name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/zodiac0806/BossmodReborn-TC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release TataruPraise/TataruPraise.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './TataruPraise/bin/Release/TataruPraise/TataruPraise.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to TataruPraise.zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter latest.zip | Select-Object -First 1
          Copy-Item $zip.FullName -Destination "TataruPraise.zip"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            TataruPraise.zip
            TataruPraise/bin/Release/TataruPraise/TataruPraise.json
          generate_release_notes: true
