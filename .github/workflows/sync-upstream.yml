name: Sync Upstream & Auto Release

# 每天自動抓 ffxiv-tc-port/TataruPraise（tc-7.20）的更新，合併進本分支（tw-fix）。
# 只有在「合併乾淨（無衝突） 且 建置成功」時，才會推送、發新版 release、更新 repo.json。
# 只要遇到合併衝突或建置失敗，就整個跳過不動、工作流程標記失敗，等你手動處理，
# 不會有半殘的東西被推上去或發佈給朋友。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout tw-fix
        uses: actions/checkout@v5
        with:
          ref: tw-fix
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ffxiv-tc-port/TataruPraise.git
          git fetch upstream tc-7.20

      - name: Merge upstream
        id: merge
        shell: pwsh
        run: |
          $before = git rev-parse HEAD
          git merge --no-edit upstream/tc-7.20
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::合併發生衝突，中止並跳過本次自動流程"
            git merge --abort
            "status=conflict" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $after = git rev-parse HEAD
          if ($before -eq $after) {
            "status=nochange" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "status=merged" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Install .NET
        if: steps.merge.outputs.status == 'merged'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x

      - name: Download Dalamud (pinned TC-compatible build)
        if: steps.merge.outputs.status == 'merged'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/zodiac0806/BossmodReborn-TC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"

      - name: Build
        id: build
        if: steps.merge.outputs.status == 'merged'
        shell: pwsh
        run: |
          $current = (Get-Content -Raw repo.json | ConvertFrom-Json)[0].AssemblyVersion
          $currentBuild = [int]($current -split '\.')[3]
          $ver = "7.20.0." + ($currentBuild + 1)
          dotnet build --configuration Release TataruPraise/TataruPraise.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=$ver -p:AssemblyVersion=$ver -p:FileVersion=$ver
          if ($LASTEXITCODE -ne 0) {
            "status=failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "status=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $json = Get-Content -Raw './TataruPraise/bin/Release/TataruPraise/TataruPraise.json' | ConvertFrom-Json
          $json.AssemblyVersion = $ver
          $json | ConvertTo-Json | Set-Content -Path './TataruPraise/bin/Release/TataruPraise/TataruPraise.json'
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update repo.json
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        shell: pwsh
        run: |
          $ver = "${{ steps.build.outputs.version }}"
          $tag = "TataruPraise-v$ver-autosync"
          $json = Get-Content -Raw repo.json | ConvertFrom-Json
          $json[0].AssemblyVersion = $ver
          $json[0].DownloadLinkInstall = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.zip"
          $json[0].DownloadLinkUpdate = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.zip"
          $json[0].Changelog = "自動合併 ffxiv-tc-port/TataruPraise 上游更新（$(Get-Date -Format 'yyyy-MM-dd')）。"
          # -AsArray 是必要的：repo.json 只有一個外掛項目時，ConvertTo-Json 預設會把單元素陣列
          # 拆成裸物件（沒有外層 [ ]），Dalamud 的自訂插件庫格式要求最外層必須是陣列，
          # 拆掉了外層 [ ] 就會變成「下載失敗」。
          $json | ConvertTo-Json -Depth 10 -AsArray | Set-Content -Path repo.json
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rename artifact to latest.zip for release
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        shell: pwsh
        run: |
          Copy-Item './TataruPraise/bin/Release/TataruPraise/latest.zip' -Destination 'latest.zip'

      - name: Commit and push
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        run: |
          git add repo.json
          git commit -m "Auto-sync upstream + republish ($env:TAG)"
          git push origin tw-fix

      - name: Create release
        if: steps.merge.outputs.status == 'merged' && steps.build.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "TataruPraise ${{ steps.build.outputs.version }}（自動同步上游）"
          target_commitish: tw-fix
          files: |
            latest.zip
          generate_release_notes: false

      - name: Report unfinished sync
        if: steps.merge.outputs.status == 'conflict' || steps.build.outputs.status == 'failed'
        run: |
          echo "::error::自動同步未完成（merge=${{ steps.merge.outputs.status }}, build=${{ steps.build.outputs.status }}），需要手動處理"
          exit 1
