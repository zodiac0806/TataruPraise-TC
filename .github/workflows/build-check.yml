# 台服 (TC) 建置檢查（TataruPraise）。Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)。
# ⚠️ 跑 windows-latest：NAudio 元套件會拉 NAudio.WinForms（要 WindowsDesktop framework），
# ubuntu runner 會回 NETSDK1073；與 Saucy 的 build-check 同一招。
name: Build Check

on:
  push:
    branches:
      - 'tc-7.20'
    tags-ignore:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download Dalamud (TC pin)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/zodiac0806/BossmodReborn-TC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:DALAMUD_HOME"
          if (-not (Test-Path "$env:DALAMUD_HOME\Dalamud.dll")) { throw "Dalamud.dll missing" }
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud

      - name: Build Project
        run: dotnet build --configuration Release TataruPraise/TataruPraise.csproj
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud
